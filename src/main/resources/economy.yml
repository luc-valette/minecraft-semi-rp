# === Module Économie — Configuration ===

# --- Constantes ---
starting-balance: 1000.0
currency-name: "€"
min-balance: 0.0
decimal-places: 2
log-transactions: true

# --- Couleurs ---
colors:
  primary: "GOLD"
  success: "GREEN"
  error: "RED"
  info: "GRAY"

# --- Messages ---
messages:
  # /balance
  balance-self: "Solde : {balance}"
  balance-other: "Solde de {player} : {balance}"

  # /pay
  pay-sent: "Tu as envoyé {amount} à {player}."
  pay-received: "{player} t'a envoyé {amount}."
  pay-self: "Tu ne peux pas te payer toi-même."
  pay-negative: "Le montant doit être positif."
  insufficient-funds: "Solde insuffisant."

  # /baltop
  baltop-header: "══ Classement des fortunes ══"
  baltop-entry: "{rank}. {player} — {balance}"
  baltop-empty: "Aucun joueur enregistré."

  # /eco (admin)
  eco-give: "Donné {amount} à {player}."
  eco-take: "Retiré {amount} à {player}."
  eco-set: "Solde de {player} défini à {amount}."
  eco-received: "Tu as reçu {amount} d'un admin."
  eco-taken: "Un admin t'a retiré {amount}."
  eco-set-notify: "Ton solde a été défini à {amount} par un admin."

  # Génériques
  player-not-found: "Joueur introuvable : {value}"
  invalid-amount: "Montant invalide : {value}"
  no-permission: "Tu n'as pas la permission."
  player-only: "Cette commande ne peut être utilisée que par un joueur."
  usage-pay: "Usage : /pay <joueur> <montant>"
  usage-eco: "Usage : /eco <give|take|set> <joueur> <montant>"
  eco-unknown-action: "Action inconnue. Utilise : give, take ou set."
  error-generic: "Une erreur est survenue."
  error-detailed: "Erreur : {details}"