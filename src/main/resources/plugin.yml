name: SemiRP
version: '1.0.0'
main: fr.mc.semirp.MainPlugin
api-version: '1.21'

commands:
  balance:
    description: Voir son solde ou celui d'un joueur
    usage: /balance [joueur]
    aliases: [bal, money]
  pay:
    description: Envoyer de l'argent à un joueur
    usage: /pay <joueur> <montant>
  baltop:
    description: Classement des joueurs les plus riches
    usage: /baltop
  eco:
    description: Commandes admin d'économie
    usage: /eco <give|take|set> <joueur> <montant>
    permission: semirp.eco.admin
  sethome:
    description: Définir un home
    usage: /sethome <nom>
  home:
    description: Se téléporter à un home
    usage: /home <nom>
  delhome:
    description: Supprimer un home
    usage: /delhome <nom>
  homes:
    description: Lister ses homes
    usage: /homes
  tpa:
    description: Demander une téléportation vers un joueur
    usage: /tpa <joueur>
  tpaccept:
    description: Accepter une demande de TP
    usage: /tpaccept
  tpdeny:
    description: Refuser une demande de TP
    usage: /tpdeny
  setwarp:
    description: Créer un warp
    usage: /setwarp <nom>
    permission: semirp.tp.admin
  warp:
    description: Se téléporter à un warp
    usage: /warp <nom>
  delwarp:
    description: Supprimer un warp
    usage: /delwarp <nom>
    permission: semirp.tp.admin
  warps:
    description: Lister les warps disponibles
    usage: /warps
  back:
    description: Retourner à sa position précédente
    usage: /back

permissions:
  semirp.eco.admin:
    description: Permet d'utiliser /eco (give, take, set)
    default: op
  semirp.tp.admin:
    description: Permet de créer et supprimer des warps
    default: op